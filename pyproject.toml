[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenopoulos-logic"
version = "1.0.0"
description = "A computational implementation of Xenopoulos' Fourth Logical Structure, formalizing Hegelian-Marxist dialectics through Piaget's INRC operators forming a Klein-4 group"
readme = "README.md"
authors = [
    {name = "Katerina Xenopoulou", email = "katerinaxenopoulou@gmail.com"},
    {name = "Epameinondas Xenopoulos", email = "posthumous@epistemologyoflogic.com"}
]
maintainers = [
    {name = "Katerina Xenopoulou", email = "katerinaxenopoulou@gmail.com"}
]
license = {text = "CC BY-NC 4.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Sociology",
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = [
    "dialectics", 
    "logic", 
    "mathematics", 
    "group-theory", 
    "klein-4", 
    "piaget", 
    "hegel", 
    "marx", 
    "philosophy", 
    "cognitive-science"
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.5.0",
    "plotly>=5.13.0",
    "pillow>=9.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/kxenopoulou/xenopoulos-logic-dialectic"
Documentation = "https://github.com/kxenopoulou/xenopoulos-logic-dialectic/tree/main/docs"
Repository = "https://github.com/kxenopoulou/xenopoulos-logic-dialectic"
Issues = "https://github.com/kxenopoulou/xenopoulos-logic-dialectic/issues"
"Funding" = "https://www.epistemologyoflogic.com"
"ORCID (Xenopoulos)" = "https://orcid.org/0009-0000-1736-8555"
"ORCID (Xenopoulou)" = "https://orcid.org/0009-0004-9057-7432"

[project.scripts]
xenopoulos-cli = "xenopoulos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xenopoulos*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
"xenopoulos" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=xenopoulos --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["xenopoulos"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
